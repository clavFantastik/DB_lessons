services:
  postgres:
    image: postgres:16-alpine
    container_name: db_lessons_postgres
    environment:
      POSTGRES_DB: db_lessons
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
    ports:
      - "15432:5432"
    volumes:
      - db_lessons_pgdata:/var/lib/postgresql/data
      - .:/work:ro

  api:
    build:
      context: ./lab6
    container_name: db_lessons_api
    environment:
      DATABASE_URL: postgresql+psycopg2://db_user:db_password@postgres:5432/db_lessons
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  db_lessons_pgdata:
